{% extends 'registration/base.html' %}

{% block title %}Login | Freshers Day{% endblock %}

{% block content %}
<div class="header">
    <h1>Freshers Day</h1><span>25'</span>
</div>

<form action="" method="post">
    {% csrf_token %}
    <div class="form-group">
        <label for="username">Username</label>
        <input placeholder="Enter your username" type="text" name="username" required>
    </div>
    <div class="form-group">
        <label for="password">Password</label>
        <input placeholder="Enter your password" type="password" name="password" required>
    </div>

    <div class="buttons-forms">
        <a href="{% url 'password_reset' %}" class="forgot-button">Forgot Password?</a>
        <a href="{% url 'register_user' %}" class="Register-button">Register</a>
    </div>

    <button type="submit" class="form-button">Login</button>
</form>
{% endblock %}
