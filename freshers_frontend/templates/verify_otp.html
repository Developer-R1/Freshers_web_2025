{% extends 'base.html' %}
{% block title %}Verify OTP{% endblock %}
{%load static%}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/sign_up.css' %}">
{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="form-container mx-auto p-4 bg-dark text-white rounded shadow" style="max-width: 500px;">
    <h2 class="mb-4">Verify OTP</h2>
    <form method="post">
      {% csrf_token %}
      <input type="text" name="otp" placeholder="Enter OTP" class="form-control mb-3" required>
      <button type="submit" class="btn btn-warning w-100">Verify</button>
    </form>
  </div>
</div>
{% endblock %}
