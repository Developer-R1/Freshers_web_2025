{% extends 'base.html' %}
{% load static %}
{% block title %}Forgot Password | Freshers Day{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/sign_up.css' %}">
{% endblock %}
{% block content %}
<main class="login-page-wrapper">
  <div class="form-container">
    <h1>Forgot Password</h1>
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>Roll No.</label>
        <input type="text" name="roll_no" placeholder="Enter your roll number" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="Enter your registered email" required>
      </div>
      <button type="submit" class="form-button">Send OTP</button>
    </form>
  </div>
</main>
{% endblock %}
