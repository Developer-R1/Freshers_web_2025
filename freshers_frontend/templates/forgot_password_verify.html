{% extends 'base.html' %}
{% load static %}
{% block title %}Verify OTP | Freshers Day{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/sign_up.css' %}">
{% endblock %}
{% block content %}
<main class="login-page-wrapper">
  <div class="form-container">
    <h1>Verify OTP</h1>
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>OTP</label>
        <input type="text" name="otp" placeholder="Enter OTP" required>
      </div>
      <button type="submit" class="form-button">Verify</button>
    </form>
  </div>
</main>
{% endblock %}
