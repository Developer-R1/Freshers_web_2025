{% extends 'base.html' %}
{% load static %}
{% block title %}Login OTP | Freshers Day{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/sign_up.css' %}">
{% endblock %}
{% block content %}
<main class="login-page-wrapper">
    <div class="form-container">
        <h1>Enter OTP</h1>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="otp">OTP</label>
                <input type="text" name="otp" placeholder="Enter the OTP" required>
            </div>
            <button type="submit" class="form-button">Verify OTP</button>
        </form>
    </div>
</main>
{% endblock %}
