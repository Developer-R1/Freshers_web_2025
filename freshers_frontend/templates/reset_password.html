{% extends 'base.html' %}
{% load static %}
{% block title %}Reset Password | Freshers Day{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/sign_up.css' %}">
{% endblock %}
{% block content %}
<main class="login-page-wrapper">
  <div class="form-container">
    <h1>Reset Password</h1>
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>New Password</label>
        <input type="password" name="password1" placeholder="Enter new password" required>
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" name="password2" placeholder="Confirm new password" required>
      </div>
      <button type="submit" class="form-button">Reset</button>
    </form>
  </div>
</main>
{% endblock %}
