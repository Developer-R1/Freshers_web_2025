{% extends 'base.html' %}
{% load static %}
{% block title %}Register | Freshers Day{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'css/sign_up.css' %}">
{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="form-container mx-auto p-4 bg-dark text-white rounded shadow" style="max-width: 600px;">
    <h2 class="mb-4">Sign Up</h2>
    <form method="post" action="{% url 'signup' %}">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="form-button btn btn-warning w-100">Sign Up</button>
    </form>
    <div class="text-center mt-3">
      <a href="{% url 'login' %}" class="text-light">Already have an account?</a>
    </div> 
  </div>
</div>
{% endblock %}
